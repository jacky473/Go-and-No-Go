<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>居家指甲健康監測系統 – 實拍指甲標記表</title>
    
    <!-- 載入 Firebase v10 模組 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBkiXpkscSB3IhhE6_pqdo1mKH3bFIn_94",
          authDomain: "go-and-no-go.firebaseapp.com",
          projectId: "go-and-no-go",
          storageBucket: "go-and-no-go.firebasestorage.app",
          messagingSenderId: "702318630196",
          appId: "1:702318630196:web:f16cb603822964ce9fc161",
          measurementId: "G-ZCQ4NTRLTZ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        window.db = db;
        window.addDoc = addDoc;
        window.collection = collection;
        window.serverTimestamp = serverTimestamp;
    </script>

    <style>
        :root { 
            --primary: #3498db; 
            --success: #2ecc71; 
            --danger: #e74c3c; 
            --warning: #f39c12;
            --bg: #f8f9fa; 
            --card: #ffffff;
        }
        body { 
            margin: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            padding: 15px 10px;
            box-sizing: border-box;
            touch-action: manipulation; /* 防止手機點擊時雙擊放大 */
        }
        .container { 
            width: 100%; 
            max-width: 500px; 
            background: var(--card); 
            padding: 20px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
            text-align: center; 
            box-sizing: border-box;
        }
        h2 { margin-top: 0; margin-bottom: 10px; color: #2c3e50; font-size: 18px; }
        .progress-text { font-size: 16px; font-weight: bold; color: var(--primary); margin-bottom: 15px; }
        
        /* 圖片區域 */
        .img-box {
            width: 100%;
            height: 280px;
            background: #f0f3f6;
            border: 2px dashed #cbd5e1;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .img-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }

        /* 觸控按鈕網格 */
        .button-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 15px;
        }
        .label-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px 10px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(52, 152, 219, 0.2);
            transition: transform 0.1s, background 0.1s;
        }
        .label-btn:active { transform: scale(0.96); background: #2980b9; }
        .other-btn { background: var(--warning); box-shadow: 0 4px 6px rgba(243, 156, 18, 0.2); }
        .other-btn:active { background: #d35400; }

        /* 動態輸入框區域 */
        #otherInputBox {
            display: none;
            background: #fff3e0;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #ffe0b2;
        }
        .input-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        input[type="text"] { 
            flex: 1;
            padding: 12px; 
            border: 2px solid var(--warning); 
            border-radius: 8px; 
            font-size: 16px; 
            outline: none;
        }
        .submit-btn {
            background: var(--success);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .submit-btn:active { background: #27ae60; transform: scale(0.96); }

        /* 上一步按鈕 */
        .undo-btn {
            background: #e2e8f0;
            color: #475569;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }
        .undo-btn:active { background: #cbd5e1; }
    </style>
</head>
<body>

<div class="container">
    <h2>實拍指甲標記表</h2>
    <div id="progress" class="progress-text">載入中...</div>

    <div class="img-box">
        <img id="nailImage" src="" alt="指甲影像">
    </div>

    <!-- 手機觸控按鈕區塊 -->
    <div id="buttonGrid" class="button-grid">
        <button class="label-btn" onclick="handleLabel('健康指甲')">健康指甲</button>
        <button class="label-btn" onclick="handleLabel('直向條紋')">直向條紋</button>
        <button class="label-btn" onclick="handleLabel('白甲症')">白甲症</button>
        <button class="label-btn" onclick="handleLabel('灰指甲')">灰指甲</button>
        <button class="label-btn" onclick="handleLabel('粗甲症')">粗甲症</button>
        <button class="label-btn other-btn" onclick="showOtherInput()">其他 (自訂)</button>
    </div>

    <!-- 動態顯示的其他疾病輸入框 (包含專屬送出按鈕) -->
    <div id="otherInputBox">
        <p style="margin: 0; color: #d35400; font-weight: bold; font-size: 14px; text-align: left;">請輸入疾病名稱：</p>
        <div class="input-row">
            <input type="text" id="otherText" placeholder="例如：黑甲症...">
            <button class="submit-btn" onclick="submitOther()">確認</button>
        </div>
    </div>

    <button class="undo-btn" onclick="undoLast()">↩️ 上一步 (重新標記)</button>
</div>

<script>
// 1. 自動產生圖片陣列 (1.png 到 70.png)
const imageList = [];
for (let i = 1; i <= 70; i++) {
    imageList.push(`${i}.png`);
}

let currentIndex = 0;
const results = [];

// 2. 抓取 HTML 元素
const nailImageElement = document.getElementById('nailImage');
const progressElement = document.getElementById('progress');
const buttonGrid = document.getElementById('buttonGrid');
const otherInputBox = document.getElementById('otherInputBox');
const otherTextInput = document.getElementById('otherText');

// 3. 更新畫面顯示
function updateDisplay() {
    if (currentIndex < imageList.length) {
        nailImageElement.style.display = 'block';
        nailImageElement.src = imageList[currentIndex];
        progressElement.innerText = `進度：${currentIndex + 1} / ${imageList.length}`;
        
        // 恢復顯示主按鈕，隱藏輸入框
        buttonGrid.style.display = 'grid';
        otherInputBox.style.display = 'none';
        otherTextInput.value = '';
    } else {
        // 70 張全部完成
        nailImageElement.style.display = 'none';
        buttonGrid.style.display = 'none';
        otherInputBox.style.display = 'none';
        document.querySelector('.undo-btn').style.display = 'none';
        progressElement.innerText = "⏳ 所有圖片已標記完成！正在儲存至雲端...";
        saveToFirebase();
    }
}

// 4. 處理一般按鈕點擊
function handleLabel(labelValue) {
    saveAndNext(labelValue);
}

// 5. 處理「其他」按鈕點擊
function showOtherInput() {
    buttonGrid.style.display = 'none'; // 隱藏主按鈕，避免誤觸
    otherInputBox.style.display = 'block';
    otherTextInput.focus();
}

// 6. 處理「其他」輸入框的確認送出
function submitOther() {
    const val = otherTextInput.value.trim();
    if (val !== "") {
        saveAndNext("其他", val);
    } else {
        alert("請輸入疾病名稱！");
    }
}

// 7. 記錄結果並切換下一張
function saveAndNext(labelValue, note = "") {
    results.push({
        image: imageList[currentIndex],
        label: labelValue,
        note: note
    });
    currentIndex++;
    updateDisplay();
}

// 8. 上一步功能 (退回上一張)
function undoLast() {
    if (currentIndex > 0) {
        currentIndex--;
        results.pop();
        updateDisplay();
    }
}

// 9. 將結果寫入 Firebase
async function saveToFirebase() {
    try {
        await addDoc(collection(db, "results"), {
            timestamp: serverTimestamp(),
            total_count: results.length,
            details: results
        });
        progressElement.innerHTML = "<span style='color: var(--success);'>🎉 感謝協助！所有標記結果已成功儲存至雲端資料庫！</span>";
    } catch (error) {
        console.error("Firebase 儲存失敗:", error);
        progressElement.innerHTML = "<span style='color: var(--danger);'>❌ 儲存至資料庫失敗，請檢查網路連線。</span>";
    }
}

// 初始化顯示第一張圖片
updateDisplay();
</script>

</body>
</html>
