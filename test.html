<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>居家指甲健康監測系統 – 實拍指甲標記表</title>
    
    <!-- 載入 Firebase v10 模組 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBkiXpkscSB3IhhE6_pqdo1mKH3bFIn_94",
          authDomain: "go-and-no-go.firebaseapp.com",
          projectId: "go-and-no-go",
          storageBucket: "go-and-no-go.firebasestorage.app",
          messagingSenderId: "702318630196",
          appId: "1:702318630196:web:f16cb603822964ce9fc161",
          measurementId: "G-ZCQ4NTRLTZ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        // 拋出至全域供 script 使用
        window.db = db;
        window.addDoc = addDoc;
        window.collection = collection;
        window.serverTimestamp = serverTimestamp;
    </script>

    <style>
        :root { 
            --primary: #3498db; 
            --success: #2ecc71; 
            --danger: #e74c3c; 
            --bg: #f8f9fa; 
            --card: #ffffff;
        }
        body { 
            margin: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px 10px;
            box-sizing: border-box;
        }
        .container { 
            width: 100%; 
            max-width: 520px; 
            background: var(--card); 
            padding: 25px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
            text-align: center; 
        }
        h2 { margin-top: 0; color: #2c3e50; font-size: 20px; }
        .progress-text { font-size: 18px; font-weight: bold; color: var(--primary); margin-bottom: 15px; }
        .img-box {
            width: 100%;
            min-height: 320px;
            background: #f0f3f6;
            border: 2px dashed #cbd5e1;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .img-box img {
            max-width: 100%;
            max-height: 380px;
            object-fit: contain;
            border-radius: 8px;
        }
        .legend-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 15px 0;
            text-align: left;
        }
        .legend-item {
            background: #f1f5f9;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
            color: #334155;
            display: flex;
            align-items: center;
        }
        .key-badge {
            background: #334155;
            color: white;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
            margin-right: 8px;
            font-size: 13px;
        }
        input[type="text"] { 
            width: 100%; 
            padding: 12px; 
            border: 2px solid var(--primary); 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 16px; 
            margin-top: 8px;
            outline: none;
        }
        .undo-btn {
            background: #e2e8f0;
            color: #475569;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            margin-top: 10px;
        }
        .undo-btn:hover { background: #cbd5e1; }
    </style>
</head>
<body>

<div class="container">
    <h2>居家指甲健康監測系統 – 實拍指甲標記表</h2>
    <div id="progress" class="progress-text">載入中...</div>

    <div class="img-box">
        <img id="nailImage" src="" alt="指甲影像">
    </div>

    <!-- 動態顯示的其他疾病輸入框 -->
    <div id="otherInputBox" style="display: none; margin-bottom: 15px;">
        <p style="margin: 0; color: #e67e22; font-weight: bold; font-size: 14px;">請輸入疾病名稱，完成後按下 Enter 送出：</p>
        <input type="text" id="otherText" placeholder="例如：黑甲症...">
    </div>

    <!-- 鍵盤快捷鍵對照指南 -->
    <div class="legend-grid">
        <div class="legend-item"><span class="key-badge">1</span> 健康指甲</div>
        <div class="legend-item"><span class="key-badge">2</span> 直向條紋</div>
        <div class="legend-item"><span class="key-badge">3</span> 白甲症</div>
        <div class="legend-item"><span class="key-badge">4</span> 灰指甲</div>
        <div class="legend-item"><span class="key-badge">5</span> 粗甲症</div>
        <div class="legend-item"><span class="key-badge">6</span> 其他 (自訂輸入)</div>
    </div>

    <button class="undo-btn" onclick="undoLast()">↩️ 上一步 (Z / Backspace)</button>
</div>

<script>
// 1. 自動產生圖片陣列 (1.png 到 70.png)
const imageList = [];
for (let i = 1; i <= 70; i++) {
    imageList.push(`${i}.png`);
}

let currentIndex = 0;
const results = [];

// 2. 抓取 HTML 元素
const nailImageElement = document.getElementById('nailImage');
const progressElement = document.getElementById('progress');
const otherInputBox = document.getElementById('otherInputBox');
const otherTextInput = document.getElementById('otherText');

// 3. 更新畫面顯示
function updateDisplay() {
    if (currentIndex < imageList.length) {
        nailImageElement.style.display = 'block';
        nailImageElement.src = imageList[currentIndex];
        progressElement.innerText = `進度：${currentIndex + 1} / ${imageList.length}`;
        otherInputBox.style.display = 'none';
        otherTextInput.value = '';
    } else {
        // 70 張全部完成
        nailImageElement.style.display = 'none';
        otherInputBox.style.display = 'none';
        progressElement.innerText = "⏳ 所有圖片已標記完成！正在儲存至雲端資料庫...";
        saveToFirebase();
    }
}

// 4. 記錄結果並切換下一張
function saveAndNext(labelValue, note = "") {
    results.push({
        image: imageList[currentIndex],
        label: labelValue,
        note: note
    });
    currentIndex++;
    updateDisplay();
}

// 5. 上一步功能 (退回上一張)
function undoLast() {
    if (currentIndex > 0) {
        currentIndex--;
        results.pop();
        updateDisplay();
    }
}

// 6. 將結果寫入 Firebase Firestore
async function saveToFirebase() {
    try {
        await addDoc(collection(db, "results"), {
            timestamp: serverTimestamp(),
            total_count: results.length,
            details: results
        });
        progressElement.innerHTML = "<span style='color: var(--success);'>🎉 感謝協助！所有標記結果已成功儲存至雲端資料庫！</span>";
    } catch (error) {
        console.error("Firebase 儲存失敗:", error);
        progressElement.innerHTML = "<span style='color: var(--danger);'>❌ 儲存至資料庫失敗，請檢查網路連線。</span>";
    }
}

// 7. 監聽鍵盤快捷鍵
document.addEventListener('keydown', function(event) {
    // 如果「其他」輸入框開啟中
    if (otherInputBox.style.display === 'block') {
        if (event.key === 'Enter') {
            const val = otherTextInput.value.trim();
            if (val !== "") {
                saveAndNext("其他", val);
            } else {
                alert("請輸入疾病名稱！");
            }
        }
        return; 
    }

    // 按下 Backspace 或 Z 鍵退回上一張
    if ((event.key === 'Backspace' || event.key === 'z' || event.key === 'Z')) {
        undoLast();
        return;
    }

    // 按鍵 1~6 觸發
    switch (event.key) {
        case '1': saveAndNext("健康指甲"); break;
        case '2': saveAndNext("直向條紋"); break;
        case '3': saveAndNext("白甲症"); break;
        case '4': saveAndNext("灰指甲"); break;
        case '5': saveAndNext("粗甲症"); break;
        case '6': 
            otherInputBox.style.display = 'block';
            otherTextInput.focus();
            break;
    }
});

// 初始化顯示第一張圖片
updateDisplay();
</script>

</body>
</html>
